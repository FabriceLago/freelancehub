# Railway build/déploiement du backend. Le contexte de build reste la racine
# du repo (le Dockerfile copie depuis backend/ ET infrastructure/docker/) —
# voir Phase 14 pour le détail du Dockerfile multi-stage.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/Dockerfile.backend"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
